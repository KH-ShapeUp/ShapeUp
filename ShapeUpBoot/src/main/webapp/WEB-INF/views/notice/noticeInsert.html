<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공지사항 작성</title> 
    
    <link rel="stylesheet" href="/resources/css/notice/noticeInsert.css" />
    
  </head>
  <body>
    <header class="header-placeholder"></header>

    <div class="container">
      <div class="top-section">
        <h1 class="page-title">공지사항 작성</h1> 
        <div class="logo-area">
          <img src="path/to/your/logo.png" alt="ShapeUp 로고" />
        </div>
      </div>

      <div class="write-section">
        <div class="form-group title-group">
          <label for="noticeTitle">제목<span class="required">*</span></label>
          <input type="text" id="noticeTitle" placeholder="제목을 입력하세요" />
          
          <label for="noticeCategory">분류</label>
          <select id="noticeCategory">
            <option value="notice">공지사항</option>
            <option value="event">이벤트</option>
            <option value="discipline">징계</option>
            <option value="partnership">제휴</option>
            </select>
        </div>

        <div class="form-group file-group">
          <label>파일 첨부</label>
          <input type="text" class="file-path" readonly value="파일 선택" />
          <input type="file" id="noticeFile" class="file-input" />
          <label for="noticeFile" class="file-select-btn">파일 선택</label>
        </div>

        <div class="form-group content-group">
          <label for="noticeContent">내용을 입력하세요</label>
          <textarea id="noticeContent" placeholder="내용을 입력하세요"></textarea>
        </div>

        <div class="write-buttons">
          <button class="btn-secondary">초기화</button>
          <button class="btn-primary write-btn-submit">글쓰기</button>
        </div>
      </div>
    </div>

    <footer class="footer-placeholder"></footer>
  </body>
</html>
