<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시설 신규 등록</title>
    <!-- 카카오 지도 SDK -->
    <script
      type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey=f7deb3a806ca7664155378171a6f8121&libraries=services"
    ></script>

           
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <link rel="stylesheet" href="/resources/css/place/insertPlace.css" />
  </head>
  <body>
    <header id="mainHeader"></header>
    <main class="container">
      <h1 class="page-title">시설 신규 등록</h1>
      <form
        id="placeRegistrationForm"
        class="registration-form"
        action="/place/create"
        method="POST"
        enctype="multipart/form-data"
      >
        <section class="form-section basic-info">
          <h2>기본 정보</h2>
          <div class="input-group">
            <label for="placeName"
              >시설 이름 <span class="required">*</span></label
            >
            <input
              type="text"
              id="placeName"
              name="placeName"
              maxlength="50"
              required
            />
          </div>

          <div class="input-row">
            <div class="input-group">
              <label for="placeType"
                >시설 분류 <span class="required">*</span></label
              >
              <select id="placeType" name="placeType" required>
                <option value="" disabled selected>분류 선택</option>
                <option value="헬스장">헬스장</option>
                <option value="수영장">수영장</option>
                <option value="풋살장">풋살장(축구장)</option>
                <option value="기타 스포츠">기타 스포츠</option>
              </select>
            </div>
            <div class="input-group">
              <label for="placePrice">이용 가격 (월/시간 기준) </label>
              <input
                type="number"
                id="placePrice"
                name="placePrice"
                placeholder="숫자만 입력 (예: 50000)"
              />
            </div>
          </div>

          <div class="input-group">
            <label for="phone">연락처 <span class="required">*</span></label>
            <input
              type="text"
              id="phone"
              name="phone"
              maxlength="20"
              placeholder="예: 010-1234-5678"
              required
            />
          </div>
        </section>

        <hr />

        <section class="form-section detail-info">
          <h2>시설 상세 설명</h2>
          <div class="input-group">
            <label for="placeInfo">시설 소개 및 특징 (최대 1000자)</label>
            <textarea
              id="placeInfo"
              name="placeInfo"
              rows="5"
              maxlength="1000"
              placeholder="시설의 장점, 이용 방법 등을 상세하게 입력해주세요."
            ></textarea>
          </div>
        </section>

        <hr />

        <section class="form-section location-info">
          <h2>위치 정보 <span class="required">*</span></h2>
          <div class="address-input-group">
            <div class="input-group road-name-group">
              <label for="placeRoadName">도로명 주소</label>
              <input
                type="text"
                id="placeRoadName"
                name="placeRoadName"
                readonly
                placeholder="주소 검색을 통해 자동 입력"
              />
              <input type="hidden" id="latitude" name="latitude" />
              <input type="hidden" id="longitude" name="longitude" />
            </div>
            <button
              type="button"
              class="btn btn-search-address"
              onclick="execDaumPostcode()"
            >
              주소 검색
            </button>
          </div>

          <div class="input-group">
            <label for="placeLocalName">지번 주소</label>
            <input
              type="text"
              id="placeLocalName"
              name="placeLocalName"
              readonly
              placeholder="지번 주소 (선택 사항)"
            />
          </div>

          <div class="map-placeholder">
                                   
            <div id="mapContainer" style="width: 500px; height: 400px">
              주소 검색 후 지도가 표시됩니다.
            </div>
          </div>
        </section>

        <hr />

        <section class="form-section image-upload">
          <h2>시설 이미지 첨부</h2>
          <p class="guide-text">
            최소 1개 이상의 시설 사진을 등록해야 합니다. (첫 번째 사진이 대표
            이미지로 사용됩니다.)
          </p>
          <div class="file-upload-area">
            <input
              type="file"
              id="placeImages"
              name="placeImages"
              accept="image/*"
              multiple
              required
            />
            <div id="imagePreview" class="image-preview">
              업로드된 이미지 미리보기
            </div>
          </div>
        </section>

        <hr />

        <div class="action-buttons">
          <button type="submit" class="btn btn-primary">시설 등록하기</button>
          <button
            type="button"
            class="btn btn-secondary"
            onclick="window.history.back()"
          >
            취소
          </button>
        </div>
      </form>
    </main>
    <script>
      let map;
      let marker;
      let geocoder;

      /**
       * 1. Daum 우편번호 서비스 팝업 실행
       */
      function execDaumPostcode() {
        new daum.Postcode({
          oncomplete: function (data) {
            const roadNameInput = document.getElementById("placeRoadName");
            const localNameInput = document.getElementById("placeLocalName");

            // 주소 필드 업데이트
            roadNameInput.value = data.roadAddress;
            localNameInput.value = data.jibunAddress || "";

            // 좌표 검색 함수 호출
            searchAddrToCoords(data.roadAddress);
          },
        }).open();
      }

      /**
       * 2. 주소 문자열을 위도/경도 좌표로 변환하고 지도에 표시
       */
      function searchAddrToCoords(address) {
        const latitudeInput = document.getElementById("latitude");
        const longitudeInput = document.getElementById("longitude");

        // Geocoder 객체가 없으면 생성 (스크립트 로드 타이밍 문제 대비)
        if (!geocoder) {
          geocoder = new kakao.maps.services.Geocoder();
        }

        geocoder.addressSearch(address, function (result, status) {
          if (status === kakao.maps.services.Status.OK) {
            let coords = new kakao.maps.LatLng(result[0].y, result[0].x);

            // 위도/경도 필드 업데이트
            latitudeInput.value = result[0].y;
            longitudeInput.value = result[0].x;

            // 지도 및 마커 업데이트
            map.setCenter(coords);
            marker.setPosition(coords);
            map.relayout();
          } else {
            console.error("좌표 변환 실패:", status);
            latitudeInput.value = "";
            longitudeInput.value = "";
          }
        });
      }

      /**
       * 3. 맵 초기화 함수
       */
      function initMap() {
        const mapContainer = document.getElementById("mapContainer");

        // 지도 초기화 옵션
        const mapOption = {
          center: new kakao.maps.LatLng(37.566826, 126.9786567), // 서울 시청 초기 좌표
          level: 3,
        };

        // 지도 객체, Geocoder, 마커 생성
        map = new kakao.maps.Map(mapContainer, mapOption);
        geocoder = new kakao.maps.services.Geocoder();
        marker = new kakao.maps.Marker({ map: map });
      }

      /**
       * 4. 이미지 미리보기 (기존 기능 복원)
       */
      function setupImagePreview() {
        const fileInput = document.getElementById("placeImages");
        const previewContainer = document.getElementById("imagePreview");

        fileInput.addEventListener("change", function () {
          previewContainer.innerHTML = "업로드된 이미지 미리보기";
          const files = this.files;

          if (files.length > 0) {
            previewContainer.innerHTML = "";
          }

          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.type.startsWith("image/")) {
              const reader = new FileReader();
              reader.onload = function (e) {
                const imgWrapper = document.createElement("div");
                imgWrapper.classList.add("image-item");

                const img = document.createElement("img");
                img.src = e.target.result;
                img.style.width = "100px";
                img.style.height = "100px";
                img.style.objectFit = "cover";
                img.style.borderRadius = "6px";
                img.style.border =
                  i === 0 ? "3px solid #1a73e8" : "1px solid #ddd";

                const label = document.createElement("span");
                label.innerText = i === 0 ? "대표" : "서브";
                label.style.fontSize = "0.8em";
                label.style.marginTop = "4px";
                label.style.textAlign = "center";
                label.style.color = i === 0 ? "#1a73e8" : "#555";

                imgWrapper.appendChild(img);
                imgWrapper.appendChild(label);
                previewContainer.appendChild(imgWrapper);
              };
              reader.readAsDataURL(file);
            }
          }
        });
      }

      // 카카오 지도 SDK 로드 확인 후 initMap 실행
      window.onload = function () {
        if (window.kakao && window.kakao.maps) {
          initMap();
          setupImagePreview(); // 이미지 미리보기도 로드 시점에 실행
        } else {
          console.error(
            "Kakao Maps SDK 로드에 문제가 발생했습니다. 지도 기능이 작동하지 않을 수 있습니다."
          );
          setupImagePreview();
        }
      };
    </script>
  </body>
</html>
