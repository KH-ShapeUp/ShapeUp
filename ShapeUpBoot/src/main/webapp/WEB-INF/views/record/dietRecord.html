<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘의 식단</title>
    <link rel="stylesheet" href="/resources/css/record/dietRecord.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>헤더</header>
    <main>
      <h2>오늘의 식단</h2>
      <div class="content">
        <div class="left-box-wrapper">
          <div class="meal-summary">
            <img
              src="https://img.icons8.com/ios-filled/50/000000/thumb-up.png"
              alt="like"
            />
            <span>오늘의 식단 한줄평</span>
          </div>
          <div class="left-box">
            <div class="calorie-box">
              <div class="date-list">
                <div class="date-item">2025.11.10</div>
                <div class="date-item active">2025.11.11</div>
                <div class="date-item">2025.11.12</div>
              </div>
              <div class="calorie-display">
                <div class="circle-ratio">
                  <span>탄단지 비율</span>
                </div>
                <div class="calorie-value">
                  <span class="value">0 Kcal</span>
                  <span class="label">/제한 칼로리</span>
                </div>
              </div>

              <div class="nutrition-grid">
                <div class="nutrition-item">
                  <div class="icon-text">
                    <img src="" alt="carbohydrate-icon" />
                    <span class="nutrient">탄수화물</span>
                  </div>
                  <span class="amount">0 / 220g</span>
                </div>
                <div class="nutrition-item">
                  <div class="icon-text">
                    <img src="" alt="protein-icon" />
                    <span class="nutrient">단백질</span>
                  </div>
                  <span class="amount">0 / 80g</span>
                </div>
                <div class="nutrition-item">
                  <div class="icon-text">
                    <img src="" alt="fat-icon" />
                    <span class="nutrient">지방</span>
                  </div>
                  <span class="amount">섭취량/제한 g</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="right-box">
          <div class="meal-time">
            <div class="meal-label">🌅 아침</div>
            <div class="meal-info">
              <span class="add-button">식단 추가</span>
              <span class="kcal-value">0 Kcal</span>
            </div>
          </div>
          <div class="meal-time">
            <div class="meal-label">🌞 점심</div>
            <div class="meal-info">
              <span class="add-button">식단 추가</span>
              <span class="kcal-value">0 Kcal</span>
            </div>
          </div>
          <div class="meal-time">
            <div class="meal-label">🌙 저녁</div>
            <div class="meal-info">
              <span class="add-button">식단 추가</span>
              <span class="kcal-value">0 Kcal</span>
            </div>
          </div>
          <div class="meal-time">
            <div class="meal-label">🍴 기타</div>
            <div class="meal-info">
              <span class="add-button">식단 추가</span>
              <span class="kcal-value">0 Kcal</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
