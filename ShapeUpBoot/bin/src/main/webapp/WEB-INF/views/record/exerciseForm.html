<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘의 운동</title>
    <link rel="stylesheet" href="/resources/css/record/exerciseForm.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-placeholder">헤더</div>
    </header>
    <main class="container">
      <section class="exercise-tracker">
        <div class="header-section">
          <h2>오늘의 운동</h2>
          <button class="add-exercise-btn">활동 추가하기</button>
        </div>

        <div class="summary-cards">
          <div class="card">
            <p>총 운동 시간</p>
            <p class="value">60분</p>
          </div>
          <div class="card">
            <p>총 소모 칼로리</p>
            <p class="value">600 kcal</p>
          </div>
          <div class="card">
            <p>운동 횟수</p>
            <p class="value">2 회</p>
          </div>
        </div>

        <div class="exercise-table-section">
          <div class="tabs">
            <button class="tab-btn active">전체</button>
            <button class="tab-btn">스포츠</button>
            <button class="tab-btn">유산소</button>
            <button class="tab-btn">근력</button>
            <button class="tab-btn">스트레칭</button>
          </div>

          <table class="exercise-table">
            <thead>
              <tr>
                <th>운동명</th>
                <th>활동 시간</th>
                <th>소모 칼로리</th>
                <th>삭제</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>런닝</td>
                <td>30 분</td>
                <td>300 kcal</td>
                <td><button class="delete-btn">×</button></td>
              </tr>
              <tr>
                <td>런닝</td>
                <td>30 분</td>
                <td>300 kcal</td>
                <td><button class="delete-btn">×</button></td>
              </tr>
              <tr>
                <td>런닝</td>
                <td>30 분</td>
                <td>300 kcal</td>
                <td><button class="delete-btn">×</button></td>
              </tr>
              <tr>
                <td>런닝</td>
                <td>30 분</td>
                <td>300 kcal</td>
                <td><button class="delete-btn">×</button></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="progress-section">
          <h3>진행도</h3>
          <div class="progress-bar-container">
            <div class="progress-bar" style="width: 30%"></div>
          </div>
          <div class="progress-text">
            <span>30%</span>
            <span>600 kcal / 2000 kcal</span>
          </div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="ratio-chart-card">
          <div class="chart-title">스포츠/유산소/근력/스트레칭 비율</div>
          <div class="chart-placeholder"></div>
          <div class="legend">
            <span class="legend-item" data-color="#5cb85c">스포츠</span>
            <span class="legend-item" data-color="#f0ad4e">유산소</span>
            <span class="legend-item" data-color="#d9534f">근력</span>
            <span class="legend-item" data-color="#5bc0de">스트레칭</span>
          </div>
        </div>

        <div class="weekly-calorie-card">
          <h3>주간 소모 칼로리</h3>
          <div class="bar-chart-placeholder"></div>
          <p>이번 주 목표 **90% 달성**</p>
        </div>
      </aside>
    </main>
  </body>
</html>
